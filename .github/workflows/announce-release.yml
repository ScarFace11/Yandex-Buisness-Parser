name: Announce release (version.json)

# Единственное место, где main узнаёт о новой версии.
#
# Событие `release: published` срабатывает в момент публикации черновика, то
# есть когда архивы уже скачиваются. Так установленные приложения видят версию
# ровно тогда, когда её можно поставить: раньше version.json штамповался на
# этапе сборки (пока релиз был черновиком), а `releases/latest/download/...`
# в это время отдаёт ПРЕДЫДУЩИЙ релиз — обновлятор скачивал ту же версию,
# «консоль закрывалась», а версия оставалась прежней.
#
# Запускается только событием публикации или вручную с тегом. Фонового
# расписания нет: hourly-прогон трогал main без спроса, а обещанную версию
# объявляет само событие `release: published`.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег опубликованного релиза: v2.3.4 (можно и без «v»)'
        required: true

permissions:
  contents: write

concurrency:
  group: announce-release
  cancel-in-progress: false

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Resolve the tag to announce
        # Логика — в scripts/release_tag.py: тесты проверяют ровно тот код, что
        # исполняет воркфлоу, а не отдельную копию на bash с tr/grep.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          LATEST=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
          python3 scripts/release_tag.py announce --latest "$LATEST"
      - name: Skip when the version is already announced
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          have=$(python -c "import json;print(json.load(open('static/version.json',encoding='utf-8-sig')).get('version',''))")
          echo "ANNOUNCED=$have" >> "$GITHUB_ENV"
          echo "в version.json сейчас: $have, в релизе: ${TAG#v}"

      - name: Wait for the published release with the Windows asset
        if: env.ANNOUNCED != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WR_ATTEMPTS: '15'
          WR_SLEEP: '10'
        run: |
          python3 scripts/wait_release.py --tag "$TAG"
      - name: Stamp version.json and push it to main
        if: env.SKIP != '1'
        run: |
          python3 scripts/stamp_version.py --tag "$TAG" --changelog CHANGELOG.md \
            --repo "${{ github.repository }}"
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add static/version.json
          git commit -m "chore(release): advertise v${TAG#v} in version.json [skip ci]" \
            || echo "версия уже объявлена — коммитить нечего"
          git push origin HEAD:main
